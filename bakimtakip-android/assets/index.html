/* Layout: Listeat dili — açık gri zemin, kartsız ince çizgili listeler, serif başlıklar, sarı yalnızca çizgi ikonlarda; yapılan iş üstü çizili */
:root{
  --bg:#EDEDEB; --sheet:#FFFFFF; --raise:#FFFFFF; --ink:#1E1E1E; --muted:#6D6D69; --line:#D4D4D0; --line-2:#B9B9B4;
  --yellow:#EEF23D; --scrim:rgba(20,20,20,.38);
  --bad:#C23B2A; --warn:#A87600; --ok:#3B7A4C;
  --f-serif:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151515; --sheet:#202020; --raise:#262626; --ink:#ECECE8; --muted:#9C9C97; --line:#2E2E2C; --line-2:#4A4A47;
  --yellow:#E6EB3A; --scrim:rgba(0,0,0,.62); --bad:#F07A68; --warn:#E3B83D; --ok:#6FC08A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151515; --sheet:#202020; --raise:#262626; --ink:#ECECE8; --muted:#9C9C97; --line:#2E2E2C; --line-2:#4A4A47;
  --yellow:#E6EB3A; --scrim:rgba(0,0,0,.62); --bad:#F07A68; --warn:#E3B83D; --ok:#6FC08A; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums lining-nums}
.wrap{max-width:640px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* Logo + üst çubuk */
.top .wrap{padding-block:18px 6px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:baseline;gap:7px;font-size:19px;line-height:1;white-space:nowrap}
.logo b{font-family:var(--f-sans);font-weight:800;letter-spacing:.04em}
.logo span{font-family:var(--f-sans);font-weight:300;letter-spacing:.005em}
.round{width:42px;height:42px;border-radius:50%;background:var(--raise);display:grid;place-items:center;flex:none}
.round svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* Sekmeler (Listeat: dolu / çerçeveli hap) */
.pills{display:flex;gap:8px;flex-wrap:nowrap}
.pills .pill-btn{flex:none}
.pill-btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--ink);font-size:14px;font-weight:600;color:var(--ink)}
.pill-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pill-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.nav .wrap{padding-block:14px 4px}

main .wrap{padding-block:18px calc(120px + env(safe-area-inset-bottom,0px));display:grid;gap:30px}
h1,.h1{margin:0;font-family:var(--f-serif);font-weight:300;font-size:36px;line-height:1.08;letter-spacing:-.01em;text-wrap:balance}
h2{margin:0 0 4px;font-family:var(--f-serif);font-weight:400;font-size:24px;line-height:1.15;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h2 small{font-family:var(--f-sans);font-size:13px;font-weight:500;color:var(--muted)}
.sub{font-size:13px;color:var(--muted)}
.cap{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* Araç bloğu */
.car{display:grid;gap:14px}
.car .meta{font-size:13px;color:var(--muted);margin-top:6px}
.km{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.km .v{font-family:var(--f-serif);font-weight:300;font-size:30px;line-height:1.1}
.km .v i{font-style:normal;font-family:var(--f-sans);font-size:14px;color:var(--muted);margin-left:4px}
.ghost-pill{height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--ink);font-size:13px;font-weight:600;white-space:nowrap}

/* Üstü çizili manşet */
.hero{font-family:var(--f-serif);font-weight:300;font-size:30px;line-height:1.18;letter-spacing:-.01em;margin:0;text-wrap:balance}
.hero s{text-decoration-thickness:2px;text-decoration-color:var(--ink)}
.hero em{font-style:normal}

/* Toplamlar */
.total .big{font-family:var(--f-serif);font-weight:300;font-size:46px;line-height:1.05;letter-spacing:-.015em;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin-top:16px}
.grid2>div{padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.grid2>div:nth-child(odd){padding-right:12px;border-right:1px solid var(--line)}
.grid2>div:nth-child(even){padding-left:14px}
.grid2 .v{font-family:var(--f-serif);font-size:21px;font-weight:400;margin-top:2px}

/* Listeat satırları */
.list{display:grid}
.row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.row .t{font-weight:600;font-size:15px;line-height:1.3}
.row .d{font-size:12px;color:var(--muted);margin-top:2px;display:block;overflow-wrap:anywhere}
.row .d s{text-decoration-color:var(--muted)}
.row .r{text-align:right;font-size:14px;font-weight:600;white-space:nowrap}
.row .r small{display:block;font-size:12px;font-weight:500;color:var(--muted)}

const MONTHS=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const fdate = iso=>{ if(!iso) return "—"; const [y,m,d]=iso.split("-").map(Number); return d+" "+MONTHS[m-1]+" "+y; };
const fdot = iso=>{ if(!iso) return "—"; const [y,m,d]=iso.split("-"); return d+"."+m+"."+y; };
const addMonths = (iso,n)=>{ const [y,m,d]=iso.split("-").map(Number); const dt=new Date(Date.UTC(y,m-1+n,d)); return dt.toISOString().slice(0,10); };
const daysBetween = (a,b)=>Math.round((Date.parse(b)-Date.parse(a))/86400000);
const newId = ()=> (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2,8));
const recTotal = r=>(r.lines||[]).reduce((s,l)=>s+(+l.a||0),0);
const recParts = r=>(r.lines||[]).filter(l=>l.t!=="iscilik").reduce((s,l)=>s+(+l.a||0),0);
const recLabor = r=>(r.lines||[]).filter(l=>l.t==="iscilik").reduce((s,l)=>s+(+l.a||0),0);
const XSVG='<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
function toast(msg){ const h=$("#toastHost"); h.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>'; clearTimeout(toast.t); toast.t=setTimeout(()=>h.innerHTML="",2400); }

/* ---------- Veri katmanı: hesap depolaması (db) yoksa bu cihazda yerel ---------- */
const state = { vehicle:{...DEFAULT_VEHICLE}, intervals:{}, records:[], mode:"loading", loaded:false, tab:"ozet", filter:"all", q:"" };
const LS_KEY="coskun-bakimtakip-v1";
function lsRead(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(e){ return null; } }
function lsWrite(o){ try{ localStorage.setItem(LS_KEY,JSON.stringify(o)); return true; }catch(e){ return false; } }
let db=null;

const Store = {
  async saveVehicle(v){ state.vehicle=v; render();
    if(db) await db.doc("garage/vehicle").set(v); else saveLocal(); },
  async saveIntervals(iv){ state.intervals=iv; render();
    if(db) await db.doc("garage/settings").set({intervals:iv}); else saveLocal(); },
  async saveRecord(r){ const i=state.records.findIndex(x=>x.id===r.id); if(i>=0) state.records[i]=r; else state.records.push(r); render();
    if(db){ const {id,...body}=r; await db.collection("records").doc(id).set(body); } else saveLocal(); },
  async deleteRecord(id){ state.records=state.records.filter(x=>x.id!==id); render();
    if(db) await db.collection("records").doc(id).delete(); else saveLocal(); }
};
function saveLocal(){ lsWrite({vehicle:state.vehicle,intervals:state.intervals,records:state.records}); }
function loadLocal(){ const o=lsRead(); if(o){ state.vehicle={...DEFAULT_VEHICLE,...(o.vehicle||{})}; state.intervals=o.intervals||{}; state.records=o.records||[]; } }

async function boot(){
  render();
  let cap=null;
  if(!IS_APK){ try{ if(window.claude && typeof window.claude.use==="function") cap=await window.claude.use("db"); }catch(e){ cap=null; } }
  if(!cap){ state.mode="local"; loadLocal(); state.loaded=true; render(); return; }
  db=cap; state.mode="db";
  let pending=3; const done=()=>{ if(--pending<=0){ state.loaded=true; clearTimeout(slow); } render(); };
  const slow=setTimeout(()=>{ if(!state.loaded){ state.slow=true; render(); } },10000);
  const onErr=()=>{ state.dbError=true; state.loaded=true; render(); };
  let vFirst=true,sFirst=true,rFirst=true;
  db.doc("garage/vehicle").onSnapshot(s=>{ state.vehicle = s.exists ? {...DEFAULT_VEHICLE,...s.data()} : {...DEFAULT_VEHICLE}; if(vFirst&&!s.metadata.fromCache){vFirst=false;done();} else render(); }, onErr);
  db.doc("garage/settings").onSnapshot(s=>{ state.intervals = (s.exists && s.data().intervals) || {}; if(sFirst&&!s.metadata.fromCache){sFirst=false;done();} else render(); }, onErr);
  db.collection("records").onSnapshot(q=>{ state.records = q.docs.map(d=>({id:d.id,...d.data()})); if(rFirst&&!q.metadata.fromCache){rFirst=false;done();} else render(); }, onErr);
}

/* ---------- Hesaplamalar ---------- */
function interval(cid){ const c=CAT[cid]; const o=state.intervals[cid]||{}; return {km: o.km!=null?o.km:c.km, m: o.m!=null?o.m:c.m}; }
function sortedRecords(){ return [...state.records].sort((a,b)=> (b.date||"").localeCompare(a.date||"") || (b.km||0)-(a.km||0) || (b.createdAt||0)-(a.createdAt||0)); }
function currentKm(){ const v=state.vehicle.km; const maxRec=Math.max(0,...state.records.map(r=>+r.km||0)); return v!=null? Math.max(+v,maxRec) : (maxRec||null); }
function dueInfo(cid){
  const iv=interval(cid); if(!iv.km && !iv.m) return null;
  const last = sortedRecords().find(r=>r.cat===cid);
  const km=currentKm(), today=todayISO();
  if(!last) return {cid,iv,last:null,status:"none",text:"Henüz kayıt yok",frac:0};
  let kmLeft=null, dayLeft=null, nextKm=null, nextDate=null, fr=[];
  if(iv.km && last.km!=null){ nextKm=+last.km+iv.km; if(km!=null){ kmLeft=nextKm-km; fr.push(1-kmLeft/iv.km);} }
  if(iv.m && last.date){ nextDate=addMonths(last.date,iv.m); dayLeft=daysBetween(today,nextDate); fr.push(1-dayLeft/(iv.m*30.44)); }
  let status="ok";
  if((kmLeft!=null&&kmLeft<=0)||(dayLeft!=null&&dayLeft<=0)) status="bad";
  else if((kmLeft!=null&&kmLeft<=1500)||(dayLeft!=null&&dayLeft<=30)) status="warn";
  const parts=[];
  if(kmLeft!=null) parts.push(kmLeft<=0? NUM.format(-kmLeft)+" km geçti" : NUM.format(kmLeft)+" km kaldı");
  if(dayLeft!=null) parts.push(dayLeft<=0? (-dayLeft)+" gün geçti" : (dayLeft>60? Math.round(dayLeft/30.44)+" ay kaldı" : dayLeft+" gün kaldı"));
  return {cid,iv,last,status,nextKm,nextDate,kmLeft,dayLeft,text:parts.join(" · ")||"—",frac:Math.max(0,Math.min(1,Math.max(...fr,0)))};
}
const STATUS_RANK={bad:0,warn:1,ok:2,none:3};
const STATUS_TXT={bad:"Gecikti",warn:"Yaklaştı",ok:"Normal",none:"Kayıt yok"};
function ivText(iv){ const a=[]; if(iv.km) a.push(NUM.format(iv.km)+" km"); if(iv.m) a.push(iv.m%12===0? (iv.m/12)+" yıl" : iv.m+" ay"); return a.length? "Her "+a.join(" veya ") : "Gerektiğinde"; }
const shortName = cid=>(CAT[cid]?.n||"").split(" & ")[0].replace("Motor Yağı","Yağ");

/* ---------- Görünümler ---------- */
function renderChrome(){
  document.querySelectorAll("[data-tab]").forEach(t=>t.setAttribute("aria-pressed", String(t.dataset.tab===state.tab)));
}

function viewOzet(){
  const v=state.vehicle, recs=state.records;
  const total=recs.reduce((s,r)=>s+recTotal(r),0), parts=recs.reduce((s,r)=>s+recParts(r),0), labor=recs.reduce((s,r)=>s+recLabor(r),0);
  const y=String(new Date().getFullYear()); const yearTotal=recs.filter(r=>(r.date||"").startsWith(y)).reduce((s,r)=>s+recTotal(r),0);
  const kms=recs.map(r=>+r.km).filter(n=>n>0); const ck=currentKm();
  let perKm=null; if(kms.length && ck){ const span=ck-Math.min(...kms); if(span>500) perKm=total/span; }
  let h='';
  if(state.mode==="local" && !IS_APK) h+='<div class="note">Bu görünümde hesap depolaması yok; kayıtlar yalnızca bu tarayıcıda saklanıyor.</div>';
  if(state.slow && !state.loaded) h+='<div class="note">Kayıtlara henüz ulaşılamadı, bağlantı bekleniyor…</div>';

  h+=`<section class="car">
    <div><h1>${esc(v.model||"")}</h1><div class="meta">${[v.make, v.trim, v.fuel, v.year].filter(Boolean).map(esc).join(" · ")}</div></div>
    <div class="km"><div><div class="cap">Mevcut km</div><div class="v num">${v.km!=null?NUM.format(v.km):"—"}<i>km</i></div>${v.kmDate?`<div class="sub">${fdot(v.kmDate)} tarihinde güncellendi</div>`:'<div class="sub">Henüz girilmedi</div>'}</div>
    <button class="ghost-pill" id="btnKm" type="button">${v.km!=null?"Güncelle":"Km gir"}</button></div>
  </section>`;

  // Üstü çizili manşet: son yapılanlar çizili, sıradaki düz
  const recent=[]; sortedRecords().forEach(r=>{ if(!recent.includes(r.cat) && recent.length<3) recent.push(r.cat); });
  const next=CATS.map(c=>dueInfo(c.id)).filter(d=>d && d.status!=="none").sort((a,b)=>STATUS_RANK[a.status]-STATUS_RANK[b.status]||b.frac-a.frac)[0];
  if(recent.length){
    h+=`<p class="hero">${recent.map(c=>"<s>"+esc(shortName(c))+".</s>").join(" ")}${next?` <em>Sırada ${esc(shortName(next.cid).toLocaleLowerCase("tr"))}.</em>`:""}</p>`;
  } else {
    h+=`<p class="hero">Yağ. Filtre. Triger. <em>Hepsi tek defterde.</em></p>`;
  }

  h+=`<section class="total"><div class="cap">Genel toplam masraf</div><div class="big num">${money(total)}</div><div class="sub">${recs.length} bakım kaydı</div>
    <div class="grid2">
      <div><div class="cap">Parça</div><div class="v num">${money(parts)}</div></div>
      <div><div class="cap">İşçilik</div><div class="v num">${money(labor)}</div></div>
      <div><div class="cap">${y} yılı</div><div class="v num">${money(yearTotal)}</div></div>
      <div><div class="cap">Km başına</div><div class="v num">${perKm!=null? NUM.format(Math.round(perKm*100)/100)+" ₺" : "—"}</div>${perKm==null?'<div class="sub">En az iki km kaydı gerekir</div>':''}</div>
    </div></section>`;

  const dues=CATS.map(c=>dueInfo(c.id)).filter(d=>d && d.status!=="none").sort((a,b)=>STATUS_RANK[a.status]-STATUS_RANK[b.status]||b.frac-a.frac).slice(0,5);
  h+=`<section><h2>Yaklaşan bakımlar<small>${v.km==null?"Km girilmedi":""}</small></h2>`;
  if(dues.length){
    h+='<div class="list">'+dues.map(d=>`<button class="row" type="button" data-plan="${d.cid}">${ic(d.cid)}<span><span class="t">${esc(CAT[d.cid].n)}</span><span class="d">${esc(d.text)}</span></span><span class="st ${d.status}">${STATUS_TXT[d.status]}</span></button>`).join("")+'</div>';
  } else h+='<div class="empty"><b>Plan için kayıt bekleniyor</b><span>Yağ, filtre, triger gibi bakımları kaydettikçe bir sonraki bakım zamanı burada görünür.</span></div>';
  h+='</section>';

  const byCat={}; recs.forEach(r=>{ (byCat[r.cat]=byCat[r.cat]||{t:0,n:0}); byCat[r.cat].t+=recTotal(r); byCat[r.cat].n++; });
  const rows=Object.entries(byCat).sort((a,b)=>b[1].t-a[1].t); const max=Math.max(1,...rows.map(r=>r[1].t));
  h+=`<section><h2>Bakım türüne göre<small class="num">${money(total)}</small></h2>`;
  if(rows.length){
    h+='<div class="list">'+rows.map(([cid,o])=>`<button class="row" type="button" data-filtergo="${cid}">${ic(cid)}<span><span class="t">${esc((CAT[cid]||{n:cid}).n)}</span><span class="d">${o.n} kayıt · toplamın %${total?Math.round(o.t/total*100):0}'i</span><span class="meter"><span style="width:${o.t/max*100}%"></span></span></span><span class="r num">${money(o.t)}</span></button>`).join("")+'</div>';
  } else h+='<div class="empty"><b>Henüz masraf yok</b><span>Sağ alttaki + düğmesiyle ilk bakım kaydını ekle.</span></div>';
  h+='</section>';
  return h;
}

function viewKayit(){
  const used=[...new Set(state.records.map(r=>r.cat))];
  let list=sortedRecords();
  if(state.filter!=="all") list=list.filter(r=>r.cat===state.filter);
  const q=state.q.trim().toLocaleLowerCase("tr");
  if(q) list=list.filter(r=>[CAT[r.cat]?.n,(r.ops||[]).join(" "),r.customOp,r.shop,r.note,(r.lines||[]).map(l=>l.d).join(" ")].join(" ").toLocaleLowerCase("tr").includes(q));
  const ftotal=list.reduce((s,r)=>s+recTotal(r),0);
  let h=`<div class="stack"><h1>Kayıtlar</h1>
    <input class="search" id="q" type="search" placeholder="Parça, servis veya not ara" value="${esc(state.q)}" aria-label="Kayıtlarda ara">
    <div class="chips"><button class="pill-btn" type="button" data-filter="all" aria-pressed="${state.filter==="all"}">Tümü</button>${CATS.filter(c=>used.includes(c.id)).map(c=>`<button class="pill-btn" type="button" data-filter="${c.id}" aria-pressed="${state.filter===c.id}">${esc(c.n)}</button>`).join("")}</div>
    <div class="sub num">${list.length} kayıt · ${money(ftotal)}</div></div>`;
  if(!list.length){ return h+'<div class="empty"><b>'+(state.records.length?"Eşleşen kayıt yok":"Henüz bakım kaydı yok")+'</b><span>'+(state.records.length?"Filtreyi veya aramayı değiştir.":"Sağ alttaki + düğmesiyle ilk kaydı ekle.")+'</span></div>'; }
  const groups={}; list.forEach(r=>{ const k=(r.date||"").slice(0,7); (groups[k]=groups[k]||[]).push(r); });
  Object.entries(groups).forEach(([k,arr])=>{
    const [yy,mm]=k.split("-"); const gt=arr.reduce((s,r)=>s+recTotal(r),0);
    h+=`<section><div class="month"><span>${mm?MONTHS[+mm-1]+" "+yy:"Tarihsiz"}</span><span class="num">${money(gt)}</span></div><div class="list">`+arr.map(r=>{
      const ops=[...(r.ops||[]).map(o=>"<s>"+esc(o)+"</s>"), r.customOp?"<s>"+esc(r.customOp)+"</s>":""].filter(Boolean).join(", ");
      return `<button class="row" type="button" data-edit="${esc(r.id)}">${ic(r.cat)}
        <span><span class="t">${esc(CAT[r.cat]?.n||r.cat)}</span><span class="d">${fdot(r.date)}${r.km!=null?" · "+kmf(r.km):""}${r.shop?" · "+esc(r.shop):""}</span>${ops?`<span class="d">${ops}</span>`:""}</span>
        <span class="r num">${money(recTotal(r))}</span></button>`; }).join("")+'</div></section>';
  });
  return h;
}

function viewPlan(){
  const all=CATS.map(c=>({c,d:dueInfo(c.id)}));
  const planned=all.filter(x=>x.d).sort((a,b)=>STATUS_RANK[a.d.status]-STATUS_RANK[b.d.status]||b.d.frac-a.d.frac);
  const other=all.filter(x=>!x.d);
  let h=`<div class="stack"><h1>Bakım planı</h1><div class="sub">Mevcut: ${kmf(currentKm())} · Aralıklar FİAT Egea 1.4 Fire için yaygın önerilerdir; ayarlar düğmesinden servis kitapçığına göre değiştirebilirsin.</div></div>`;
  h+='<section><h2>Düzenli bakımlar</h2><div class="list">'+planned.map(({c,d})=>{
    const lastTxt = d.last? `Son ${fdot(d.last.date)}${d.last.km!=null?" · "+kmf(d.last.km):""}` : ivText(d.iv);
    const nextTxt = d.last? ` · Sonraki ${[d.nextKm?kmf(d.nextKm):null,d.nextDate?fdot(d.nextDate):null].filter(Boolean).join(" / ")}` : "";
    return `<button class="row" type="button" data-addcat="${c.id}">${ic(c.id)}
      <span><span class="t">${esc(c.n)}</span><span class="d">${d.last?esc(ivText(d.iv))+" · ":""}${esc(lastTxt+nextTxt)}</span>
      ${d.last?`<span class="meter"><span class="${d.status}" style="width:${Math.round(d.frac*100)}%"></span></span>`:""}</span>
      <span class="r"><span class="st ${d.status}">${d.status==="none"?"Kayıt yok":esc(d.text.split(" · ")[0])}</span></span></button>`; }).join("")+'</div></section>';
  h+='<section><h2>Kontrol üzerine<small>Sabit aralık yok</small></h2><div class="list">'+other.map(({c})=>{ const last=sortedRecords().find(r=>r.cat===c.id);
    return `<button class="row" type="button" data-addcat="${c.id}">${ic(c.id)}<span><span class="t">${esc(c.n)}</span><span class="d">${last?"Son "+fdot(last.date)+(last.km!=null?" · "+kmf(last.km):""):esc(c.s)}</span></span><span class="r">+ Ekle</span></button>`; }).join("")+'</div></section>';
  return h;
}

function render(){
  renderChrome();
  const v=$("#view");
  if(state.mode==="loading"){ v.innerHTML='<div class="empty"><b>Defter açılıyor</b><span>Bakım kayıtların yükleniyor…</span></div>'; return; }
  const focusQ = document.activeElement && document.activeElement.id==="q"; const pos=focusQ? document.activeElement.selectionStart : 0;
  v.innerHTML = state.tab==="ozet"? viewOzet() : state.tab==="kayit"? viewKayit() : viewPlan();
  if(focusQ){ const q=$("#q"); if(q){ q.focus(); try{q.setSelectionRange(pos,pos);}catch(e){} } }
}

/* ---------- Alt sayfa iskeleti ---------- */
function sheetShell(title, body, foot){
  return `<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <button class="closer" type="button" data-close aria-label="Kapat">${XSVG}</button>
    <div class="sheet-body"><div class="wrap">${body}</div></div>
    <div class="sheet-foot"><div class="wrap">${foot}</div></div>
  </div></div>`;
}
function mountSheet(html){ const host=$("#sheetHost"); const b=host.querySelector(".sheet-body"); const sc=b?b.scrollTop:0; host.innerHTML=html; document.body.style.overflow="hidden"; const nb=host.querySelector(".sheet-body"); if(nb) nb.scrollTop=sc; }

/* ---------- Bakım kaydı formu ---------- */
let form=null;
function openRecord(rec, presetCat){
  const isNew=!rec;
  form = rec? JSON.parse(JSON.stringify(rec)) : {id:newId(), cat:presetCat||"", date:todayISO(), km:state.vehicle.km!=null?state.vehicle.km:"", ops:[], customOp:"", lines:[], shop:"", note:"", createdAt:Date.now()};
  form._isNew=isNew; form._confirm=false;
  if(!form.lines || !form.lines.length) form.lines=[{d:"",t:"parca",a:""},{d:"İşçilik",t:"iscilik",a:""}];
  $("#sheetHost").innerHTML=""; drawSheet();
}
function sums(){ const parts=form.lines.filter(l=>l.t!=="iscilik").reduce((s,l)=>s+(parseNum(l.a)||0),0); const labor=form.lines.filter(l=>l.t==="iscilik").reduce((s,l)=>s+(parseNum(l.a)||0),0); return {parts,labor}; }
function sumHTML(p,l){ return `<div><span>Parça</span><span>${money(p)}</span></div><div><span>İşçilik</span><span>${money(l)}</span></div><div class="tot"><span>Bu bakımın toplamı</span><span>${money(p+l)}</span></div>`; }
function drawSheet(){
  const f=form; const c=CAT[f.cat]; const {parts,labor}=sums();
  let b=`<h3>${f._isNew?"Yeni bakım":"Kaydı düzenle"}</h3>
    <div class="field"><span class="flabel">Bakım türü</span>
      <div class="catpills">${CATS.map(x=>`<button class="pill-btn" type="button" data-cat="${x.id}" aria-pressed="${f.cat===x.id}">${esc(x.n)}</button>`).join("")}</div>
    </div>`;
  if(c){
    b+=`<div class="row2">
      <div class="field"><label for="fDate">Tarih</label><input class="input" id="fDate" type="date" value="${esc(f.date)}"></div>
      <div class="field"><label for="fKm">Kilometre</label><input class="input num" id="fKm" inputmode="numeric" placeholder="ör. 45000" value="${esc(f.km)}"></div>
    </div>
    <div class="field"><span class="flabel">Yapılan işlemler · ${esc(c.n)}</span>
      <div class="opts">${c.ops.map(o=>`<button class="opt" type="button" data-op="${esc(o)}" aria-pressed="${f.ops.includes(o)}"><span class="radio"></span><span class="lbl">${esc(o)}</span></button>`).join("")}</div>
      <input class="input" id="fCustom" placeholder="Listede olmayan işlem (isteğe bağlı)" value="${esc(f.customOp)}">
    </div>
    <div class="field"><span class="flabel">Parça ve işçilik masrafları</span>
      <div class="lines">${f.lines.map((l,i)=>`<div class="line">
        <input class="input" data-ld="${i}" placeholder="${l.t==="iscilik"?"İşçilik açıklaması":"Parça adı / marka"}" value="${esc(l.d)}" aria-label="Açıklama">
        <input class="input num" data-la="${i}" inputmode="decimal" placeholder="0 ₺" value="${esc(l.a)}" aria-label="Tutar (TL)">
        <button class="x" type="button" data-ldel="${i}" aria-label="Satırı sil">${XSVG}</button>
        <div class="kind"><button class="seg" type="button" data-lt="${i}" data-v="parca" aria-pressed="${l.t!=="iscilik"}">Parça</button><button class="seg" type="button" data-lt="${i}" data-v="iscilik" aria-pressed="${l.t==="iscilik"}">İşçilik</button></div>
      </div>`).join("")}</div>
      <div class="adds"><button class="pill-btn" type="button" data-addline="parca">+ Parça</button><button class="pill-btn" type="button" data-addline="iscilik">+ İşçilik</button>${f.ops.length?`<button class="pill-btn" type="button" data-fromops style="border-color:var(--line-2)">Seçili işlemleri satır yap</button>`:""}</div>
      <div class="sumbox num" id="sumbox">${sumHTML(parts,labor)}</div>
    </div>
    <div class="row2">
      <div class="field"><label for="fShop">Servis / Usta</label><input class="input" id="fShop" placeholder="ör. Yetkili servis" value="${esc(f.shop)}"></div>
      <div class="field"><label for="fNote">Not</label><input class="input" id="fNote" placeholder="Yağ markası, garanti…" value="${esc(f.note)}"></div>
    </div>
    <div class="err" id="fErr"></div>`;
    if(!f._isNew){
      b+= f._confirm? `<div class="confirm"><b>Bu kayıt kalıcı olarak silinsin mi?</b><div><button class="danger-btn" type="button" data-delyes>Evet, sil</button><button class="outline-btn" type="button" data-delno>Vazgeç</button></div></div>`
                    : `<button class="link danger" type="button" data-del>Kaydı sil</button>`;
    }
  } else b+='<div class="hint">Önce bakım türünü seç; ardından tarih, işlemler ve masraflar açılır.</div>';
  const foot=`<div class="sum"><div class="cap">Toplam</div><div class="v num" id="footTotal">${money(parts+labor)}</div></div><button class="dark-btn" type="button" data-save ${c?"":"disabled"}>Kaydet</button>`;
  mountSheet(sheetShell(f._isNew?"Yeni bakım":"Kaydı düzenle", b, foot));
}
function readFormInputs(){
  if(!form) return; const g=id=>{const e=document.getElementById(id);return e?e.value:undefined};
  ["fDate:date","fKm:km","fCustom:customOp","fShop:shop","fNote:note"].forEach(p=>{const [id,k]=p.split(":"); const v=g(id); if(v!==undefined) form[k]=v;});
  document.querySelectorAll("[data-ld]").forEach(e=>form.lines[+e.dataset.ld].d=e.value);
  document.querySelectorAll("[data-la]").forEach(e=>form.lines[+e.dataset.la].a=e.value);
}
function updateSums(){
  readFormInputs(); const {parts,labor}=sums();
  const sb=$("#sumbox"); if(sb) sb.innerHTML=sumHTML(parts,labor);
  const ft=$("#footTotal"); if(ft) ft.textContent=money(parts+labor);
}
function closeSheet(){ form=null; $("#sheetHost").innerHTML=""; document.body.style.overflow=""; }
async function saveForm(){
  readFormInputs(); const f=form; const err=$("#fErr");
  const km = String(f.km).trim()===""? null : parseNum(f.km);
  if(!f.date){ err.textContent="Tarih seç."; return; }
  if(km!=null && (!isFinite(km)||km<0)){ err.textContent="Kilometre sayı olmalı (ör. 45000)."; return; }
  const lines=[]; for(const l of f.lines){ const a=String(l.a).trim()===""?0:parseNum(l.a); if(!isFinite(a)||a<0){ err.textContent="Tutarlar sayı olmalı (ör. 1250,50)."; return; } if(l.d.trim()||a) lines.push({d:l.d.trim(),t:l.t==="iscilik"?"iscilik":"parca",a:Math.round(a*100)/100}); }
  const rec={id:f.id,cat:f.cat,date:f.date,km:km!=null?Math.round(km):null,ops:f.ops,customOp:(f.customOp||"").trim(),lines,shop:(f.shop||"").trim(),note:(f.note||"").trim(),createdAt:f.createdAt||Date.now(),updatedAt:Date.now()};
  const wasNew=f._isNew; closeSheet();
  try{
    await Store.saveRecord(rec);
    if(rec.km!=null && (state.vehicle.km==null || rec.km>state.vehicle.km)) await Store.saveVehicle({...state.vehicle,km:rec.km,kmDate:rec.date});
    toast(wasNew?"Bakım kaydedildi":"Değişiklikler kaydedildi");
  }catch(e){ toast(e&&e.code==="quota_exceeded"?"Depolama dolu; eski kayıtları silip tekrar dene.":"Kaydedilemedi. Bağlantını kontrol edip tekrar dene."); }
}

/* ---------- Km güncelleme ---------- */
function openKm(){
  const v=state.vehicle;
  const b=`<h3>Mevcut kilometre</h3>
    <div class="field"><label for="kmIn">Göstergedeki km</label><input class="input num kmbig" id="kmIn" inputmode="numeric" placeholder="48250" value="${v.km!=null?esc(v.km):""}"></div>
    <div class="hint">Bakım planındaki "km kaldı" hesapları bu değere göre yapılır. Bir bakım kaydına daha yüksek km girersen bu değer kendiliğinden güncellenir.</div>
    <div class="err" id="kmErr"></div>`;
  mountSheet(sheetShell("Mevcut kilometre", b, `<div class="sum"></div><button class="dark-btn" type="button" data-savekm>Kaydet</button>`));
  setTimeout(()=>{const i=$("#kmIn"); i&&i.focus();},80);
}
async function saveKm(){
  const raw=$("#kmIn").value; const km=parseNum(raw);
  if(!isFinite(km)||km<0||km>2000000){ $("#kmErr").textContent="Geçerli bir kilometre yaz (ör. 48250)."; return; }
  closeSheet();
  try{ await Store.saveVehicle({...state.vehicle,km:Math.round(km),kmDate:todayISO()}); toast("Kilometre güncellendi"); }catch(e){ toast("Kaydedilemedi, tekrar dene."); }
}

/* ---------- Araç bilgileri & aralıklar ---------- */
function openCar(){
  const v=state.vehicle;
  const rows=CATS.map(c=>{const iv=interval(c.id); return `<div class="ivrow"><span>${esc(c.n)}</span><input class="input num" data-ikm="${c.id}" inputmode="numeric" value="${iv.km||""}" placeholder="—" aria-label="${esc(c.n)} km aralığı"><input class="input num" data-im="${c.id}" inputmode="numeric" value="${iv.m||""}" placeholder="—" aria-label="${esc(c.n)} ay aralığı"></div>`;}).join("");
  const b=`<h3>Aracım</h3>
    <div class="row2">
      <div class="field"><label for="cMake">Araç adı</label><input class="input" id="cMake" value="${esc(v.make)}"></div>
      <div class="field"><label for="cModel">Model</label><input class="input" id="cModel" value="${esc(v.model)}"></div>
      <div class="field"><label for="cTrim">Donanım</label><input class="input" id="cTrim" value="${esc(v.trim)}"></div>
      <div class="field"><label for="cFuel">Yakıt</label><select class="input" id="cFuel">${["Benzin","Dizel","LPG","Benzin + LPG","Hibrit","Elektrik"].map(o=>`<option${o===v.fuel?" selected":""}>${o}</option>`).join("")}</select></div>
      <div class="field"><label for="cYear">Model yılı</label><input class="input num" id="cYear" inputmode="numeric" value="${esc(v.year)}"></div>
      <div class="field"><label for="cKm">Mevcut km</label><input class="input num" id="cKm" inputmode="numeric" placeholder="ör. 48250" value="${v.km!=null?esc(v.km):""}"></div>
    </div>
    <div class="field"><span class="flabel">Bakım aralıkları</span>
      <div class="hint">Boş bırakılan alan o ölçü için hatırlatma yapmaz. Km veya ay, hangisi önce dolarsa bakım zamanı gelmiş sayılır.</div>
      <div><div class="ivrow ivhead"><span>Bakım</span><span>Km</span><span>Ay</span></div>${rows}</div>
      <button class="link" type="button" data-resetiv>Önerilen aralıklara dön</button>
    </div>
    <div class="err" id="cErr"></div>
    <div class="version"><div class="logo" style="justify-content:center"><b>COŞKUN</b><span>Bakım Takip</span></div><div class="sub">Bakım Takip ${APP_VERSION}${IS_APK?" · Veriler bu telefonda saklanır":""}</div></div>`;
  mountSheet(sheetShell("Aracım", b, `<div class="sum"></div><button class="dark-btn" type="button" data-savecar>Kaydet</button>`));
}
async function saveCar(){
  const g=id=>$("#"+id).value.trim();
  const year=parseNum(g("cYear")); const kmRaw=g("cKm"); const km=kmRaw===""?null:parseNum(kmRaw);
  if(km!=null&&(!isFinite(km)||km<0)){ $("#cErr").textContent="Kilometre sayı olmalı."; return; }
  const v={...state.vehicle,make:g("cMake"),model:g("cModel"),trim:g("cTrim"),fuel:g("cFuel"),year:isFinite(year)?year:state.vehicle.year};
  if(km!==state.vehicle.km){ v.km=km==null?null:Math.round(km); v.kmDate=todayISO(); }
  const iv={}; CATS.forEach(c=>{ const k=parseNum(document.querySelector(`[data-ikm="${c.id}"]`).value); const m=parseNum(document.querySelector(`[data-im="${c.id}"]`).value);
    const kk=isFinite(k)?Math.round(k):0, mm=isFinite(m)?Math.round(m):0; if(kk!==c.km||mm!==c.m) iv[c.id]={km:kk,m:mm}; });
  closeSheet();
  try{ await Store.saveVehicle(v); if(JSON.stringify(iv)!==JSON.stringify(state.intervals)) await Store.saveIntervals(iv); toast("Araç bilgileri kaydedildi"); }catch(e){ toast("Kaydedilemedi, tekrar dene."); }
}

/* ---------- Olaylar ---------- */
function goTab(t){ state.tab=t; render(); window.scrollTo(0,0); }
document.addEventListener("click",e=>{
  if(e.target.matches && e.target.matches("[data-scrim]")) return closeSheet();
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.tab) return goTab(t.dataset.tab);
  if(t.id==="btnAdd") return openRecord(null);
  if(t.id==="btnKm") return openKm();
  if(t.id==="btnCar") return openCar();
  if(t.dataset.filter){ state.filter=t.dataset.filter; render(); return; }
  if(t.dataset.filtergo){ state.filter=t.dataset.filtergo; state.q=""; return goTab("kayit"); }
  if(t.dataset.edit){ const r=state.records.find(x=>x.id===t.dataset.edit); if(r) openRecord(r); return; }
  if(t.dataset.addcat) return openRecord(null,t.dataset.addcat);
  if(t.dataset.plan) return goTab("plan");
  if(t.hasAttribute("data-close")) return closeSheet();
  if(t.hasAttribute("data-savekm")) return saveKm();
  if(t.hasAttribute("data-savecar")) return saveCar();
  if(t.hasAttribute("data-resetiv")){ CATS.forEach(c=>{ document.querySelector(`[data-ikm="${c.id}"]`).value=c.km||""; document.querySelector(`[data-im="${c.id}"]`).value=c.m||""; }); return; }
  if(!form) return;
  readFormInputs();
  if(t.dataset.cat){ if(form.cat!==t.dataset.cat){ form.cat=t.dataset.cat; form.ops=[]; } return drawSheet(); }
  if(t.dataset.op){ const o=t.dataset.op; form.ops=form.ops.includes(o)?form.ops.filter(x=>x!==o):[...form.ops,o]; return drawSheet(); }
  if(t.dataset.addline){ form.lines.push({d:t.dataset.addline==="iscilik"?"İşçilik":"",t:t.dataset.addline,a:""}); return drawSheet(); }
  if(t.dataset.ldel!=null){ form.lines.splice(+t.dataset.ldel,1); return drawSheet(); }
  if(t.dataset.lt!=null){ form.lines[+t.dataset.lt].t=t.dataset.v; return drawSheet(); }
  if(t.hasAttribute("data-fromops")){ const have=new Set(form.lines.map(l=>l.d)); form.lines=form.lines.filter(l=>l.d.trim()||String(l.a).trim()); form.ops.forEach(o=>{ if(!have.has(o)) form.lines.push({d:o,t:"parca",a:""}); }); if(!form.lines.some(l=>l.t==="iscilik")) form.lines.push({d:"İşçilik",t:"iscilik",a:""}); return drawSheet(); }
  if(t.hasAttribute("data-save")) return saveForm();
  if(t.hasAttribute("data-del")){ form._confirm=true; return drawSheet(); }
  if(t.hasAttribute("data-delno")){ form._confirm=false; return drawSheet(); }
  if(t.hasAttribute("data-delyes")){ const id=form.id; closeSheet(); Store.deleteRecord(id).then(()=>toast("Kayıt silindi"),()=>toast("Silinemedi, tekrar dene.")); return; }
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){ state.q=e.target.value; render(); return; }
  if(form && (e.target.dataset.la!=null)) updateSums();
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && $("#sheetHost").firstElementChild) closeSheet(); if(e.key==="Enter" && e.target.id==="kmIn") saveKm(); });

/* Android geri tuşu (APK): önce açık sayfayı kapat, sonra Özet'e dön */
window.bakimBack = function(){
  if($("#sheetHost").firstElementChild){ closeSheet(); return true; }
  if(state.tab!=="ozet"){ goTab("ozet"); return true; }
  return false;
};

boot();
})();
</script>
</body></html>
