name: Bakım Takip APK
on:
  workflow_dispatch:
  push:
    paths: ['bakimtakip-android/**']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    defaults: { run: { working-directory: bakimtakip-android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Derle ve imzala
        env:
          KS_B64: ${{ secrets.BAKIM_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.BAKIM_KEYSTORE_PASS }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          [ -f "$ANDROID_JAR" ] || export ANDROID_JAR=$(ls "$ANDROID_HOME"/platforms/*/android.jar | sort -V | tail -1)
          export AAPT2="$BT/aapt2" D8="$BT/d8" ZIPALIGN="$BT/zipalign" APKSIGNER="$BT/apksigner"
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > ks.jks; else
            KS_PASS=bakimtakip-ci; keytool -genkeypair -keystore ks.jks -storetype PKCS12 -storepass "$KS_PASS" -keypass "$KS_PASS" -alias bakimtakip -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Coskun Bakim Takip, C=TR"; fi
          export KEYSTORE=ks.jks KS_PASS
          ./build.sh
      - uses: actions/upload-artifact@v4
        with: { name: BakimTakip-1.0, path: bakimtakip-android/build/BakimTakip-1.0.apk }
      - name: Sürüm yayınla
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete bakimtakip-v1.0 -y --cleanup-tag || true
          gh release create bakimtakip-v1.0 build/BakimTakip-1.0.apk --title "Bakım Takip 1.0" --notes "COŞKUN Bakım Takip 1.0 — Android APK"
